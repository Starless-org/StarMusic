name: Landing redirect

# The landing moved to the Starless site (Starless-org/Starless). What is left
# here is the Worker that answers at the old address with a redirect to it; see
# docs/landing-hosting.md.
on:
  push:
    branches: [main]
    paths: ["landing-redirect/**", ".github/workflows/landing.yml"]
  workflow_dispatch:

concurrency:
  group: landing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish the redirect to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The token and the account are repo secrets (see docs/landing-hosting.md).
      # The token can only edit Workers: it is nobody's session.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: landing-redirect
          command: deploy
